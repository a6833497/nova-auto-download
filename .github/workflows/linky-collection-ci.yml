name: Linky collection CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install psycopg2-binary
      - name: Unit and contract tests
        run: >-
          python -m unittest -v
          test_linke_ledger_pull.py
          test_linky_fetch.py
          test_linky_sync_runner.py
          test_linky_voice_bi_audit.py
      - name: Python compile
        run: >-
          python -m py_compile
          linky_runtime.py linky_api_pagination.py linky_fetch.py linky_consumers.py
          linky_sync_runner.py linke_live_pull.py linke_ledger_pull.py
          linky_voice_bi_audit.py linky_voice_bi_batch.py backfill_voice_call.py
      - name: Shell syntax
        run: bash -n daily-sync.sh linke_live_refresh.sh linke_ledger_daily.sh
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
